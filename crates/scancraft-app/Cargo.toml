[package]
name = "scancraft-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ScanCraft native Linux scanning and geometry workflows"

[dependencies]
scancraft-core.workspace = true
scancraft-device.workspace = true
scancraft-recording.workspace = true
eframe = { version = "0.33", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libc.workspace = true
nalgebra = { version = "0.35", default-features = false, features = ["std"] }
scancraft-geometry = { path = "../scancraft-geometry" }
scancraft-workflow = { path = "../scancraft-workflow" }

scancraft-image = { path = "../scancraft-image" }

[dev-dependencies]
serde_json.workspace = true

[[bin]]
name = "scancraft"
path = "src/main.rs"
